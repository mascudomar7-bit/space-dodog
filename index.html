<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Dodge Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #0d0e15;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      touch-action: manipulation;
    }
    canvas {
      background: #161925;
      border: 2px solid #00f0ff;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
      max-width: 95vw;
      max-height: 60vh;
    }
    #controls {
      margin-top: 15px;
      display: flex;
      gap: 15px;
    }
    .btn {
      background: #00f0ff;
      color: #000;
      border: none;
      padding: 15px 35px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 8px;
      user-select: none;
      -webkit-user-select: none;
    }
    .btn:active {
      background: #00a8b3;
    }
    #soundBtn {
      margin-bottom: 10px;
      padding: 10px 20px;
      background: #1d2130;
      color: #00f0ff;
      border: 1px solid #00f0ff;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <button id="soundBtn">🎧 Music: OFF (Tap to Start Beat)</button>
  <canvas id="gameCanvas" width="400" height="500"></canvas>

  <div id="controls">
    <button class="btn" id="leftBtn">👈 Left</button>
    <button class="btn" id="rightBtn">Right 👉</button>
  </div>

  <!-- Cyberpunk / Synthwave Action Track -->
  <audio id="bgMusic" loop src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=cyberpunk-2099-10701.mp3"></audio>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const bgMusic = document.getElementById('bgMusic');
    const soundBtn = document.getElementById('soundBtn');

    let player = { x: 180, y: 440, width: 40, height: 40, speed: 5 };
    let obstacles = [];
    let score = 0;
    let gameOver = false;
    let moveLeft = false;
    let moveRight = false;
    let musicPlaying = false;

    soundBtn.addEventListener('click', () => {
      if (!musicPlaying) {
        bgMusic.play();
        bgMusic.volume = 0.5;
        soundBtn.textContent = '🎧 Music: ON';
        musicPlaying = true;
      } else {
        bgMusic.pause();
        soundBtn.textContent = '🎧 Music: OFF';
        musicPlaying = false;
      }
    });

    function playExplosionSound() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.5);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.5);
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft = true;
      if (e.key === 'ArrowRight' || e.key === 'd') moveRight = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft = false;
      if (e.key === 'ArrowRight' || e.key === 'd') moveRight = false;
    });

    const leftBtn = document.getElementById('leftBtn');
    const rightBtn = document.getElementById('rightBtn');

    const startLeft = (e) => { e.preventDefault(); moveLeft = true; };
    const stopLeft = (e) => { e.preventDefault(); moveLeft = false; };
    const startRight = (e) => { e.preventDefault(); moveRight = true; };
    const stopRight = (e) => { e.preventDefault(); moveRight = false; };

    leftBtn.addEventListener('touchstart', startLeft);
    leftBtn.addEventListener('touchend', stopLeft);
    leftBtn.addEventListener('mousedown', startLeft);
    leftBtn.addEventListener('mouseup', stopLeft);

    rightBtn.addEventListener('touchstart', startRight);
    rightBtn.addEventListener('touchend', stopRight);
    rightBtn.addEventListener('mousedown', startRight);
    rightBtn.addEventListener('mouseup', stopRight);

    function spawnObstacle() {
      if (Math.random() < 0.03) {
        let size = Math.random() * 30 + 20;
        obstacles.push({
          x: Math.random() * (canvas.width - size),
          y: -size,
          width: size,
          height: size,
          speed: Math.random() * 3 + 2
        });
      }
    }

    function update() {
      if (gameOver) return;

      if (moveLeft && player.x > 0) player.x -= player.speed;
      if (moveRight && player.x < canvas.width - player.width) player.x += player.speed;

      spawnObstacle();

      for (let i = 0; i < obstacles.length; i++) {
        let obs = obstacles[i];
        obs.y += obs.speed;

        if (
          player.x < obs.x + obs.width &&
          player.x + player.width > obs.x &&
          player.y < obs.y + obs.height &&
          player.y + player.height > obs.y
        ) {
          gameOver = true;
          playExplosionSound();
          bgMusic.pause();
        }
      }

      obstacles = obstacles.filter(obs => obs.y < canvas.height);
      score++;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#00f0ff';
      ctx.fillRect(player.x, player.y, player.width, player.height);

      ctx.fillStyle = '#ff0055';
      obstacles.forEach(obs => {
        ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
      });

      ctx.fillStyle = '#fff';
      ctx.font = '18px sans-serif';
      ctx.fillText('Score: ' + Math.floor(score / 10), 10, 25);

      if (gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff0055';
        ctx.font = '30px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
        ctx.fillStyle = '#fff';
        ctx.font = '16px sans-serif';
        ctx.fillText('Refresh page to restart', canvas.width / 2, canvas.height / 2 + 40);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
