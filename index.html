<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Dodge Ultra</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #090a0f;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      touch-action: manipulation;
      overflow: hidden;
    }
    #mission-banner {
      background: rgba(22, 25, 37, 0.9);
      border: 1px solid #ffd700;
      color: #ffd700;
      padding: 6px 14px;
      font-size: 13px;
      border-radius: 15px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
    }
    #claimBtn {
      display: none;
      background: #ffd700;
      color: #000;
      border: none;
      padding: 3px 8px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }
    #ui-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
      justify-content: center;
    }
    .top-btn {
      padding: 8px 12px;
      background: #1d2130;
      color: #00f0ff;
      border: 1px solid #00f0ff;
      border-radius: 5px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .top-btn:active {
      transform: scale(0.95);
    }
    #adBtn {
      background: #ff0055;
      color: #fff;
      border: none;
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.4);
    }
    #gameContainer {
      position: relative;
    }
    canvas {
      background: #0d0e15;
      border: 2px solid #00f0ff;
      border-radius: 8px;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.25);
      max-width: 95vw;
      max-height: 55vh;
      display: block;
    }
    #overlayScreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(9, 10, 15, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      z-index: 10;
    }
    #startBtn {
      background: linear-gradient(45deg, #00f0ff, #7000ff);
      color: #fff;
      border: none;
      padding: 15px 35px;
      font-size: 22px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 20px #00f0ff;
    }
    #shopModal {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(13, 14, 21, 0.95);
      border: 2px solid #00f0ff;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
      width: 330px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
      z-index: 100;
    }
    .shop-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .shop-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      max-height: 50vh;
      overflow-y: auto;
    }
    .shop-card {
      background: #161925;
      border: 1px solid #00f0ff;
      border-radius: 6px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .buy-btn {
      padding: 4px 10px;
      background: #00f0ff;
      color: #000;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      font-size: 11px;
      cursor: pointer;
    }
    #controls {
      margin-top: 12px;
      display: flex;
      gap: 10px;
    }
    .btn {
      background: #00f0ff;
      color: #000;
      border: none;
      padding: 14px 24px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      user-select: none;
      -webkit-user-select: none;
    }
    #fireBtn {
      background: #ff0055;
      color: #fff;
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
    }
  </style>
</head>
<body>

  <div id="mission-banner">
    🎯 <span id="missionText">Collect 5 Coins</span>
    <button id="claimBtn">CLAIM (+10 🪙)</button>
  </div>

  <div id="ui-bar">
    <button class="top-btn" id="soundBtn">🎧 Audio: OFF</button>
    <button class="top-btn" id="pauseBtn">⏸️ Pause</button>
    <button class="top-btn" id="shopBtn">🚀 Hangar</button>
    <button class="top-btn" id="adBtn">📺 Free Coins (+5 🪙)</button>
  </div>

  <div id="gameContainer">
    <canvas id="gameCanvas" width="400" height="500"></canvas>
    
    <div id="overlayScreen">
      <h1 style="color: #00f0ff; margin-bottom: 5px; text-shadow: 0 0 10px #00f0ff;">SPACE DODGE</h1>
      <p style="color: #a855f7; margin-bottom: 20px; font-size: 14px;">⚡ ULTRA EDITION</p>
      <button id="startBtn">START GAME</button>
    </div>
  </div>

  <div id="controls">
    <button class="btn" id="leftBtn">👈 Left</button>
    <button class="btn" id="fireBtn">🔥 FIRE</button>
    <button class="btn" id="rightBtn">Right 👉</button>
  </div>

  <!-- Hangar Shop Popup -->
  <div id="shopModal">
    <div class="shop-header">
      <h3>🚀 Starship Hangar</h3>
      <button class="top-btn" style="padding: 4px 8px;" onclick="toggleShop()">✖ Close</button>
    </div>
    <p style="margin-bottom: 10px; color: #ffd700;">Coins: <span id="shopCoins">0</span> 🪙</p>
    <div class="shop-grid" id="shopGrid"></div>
  </div>

  <audio id="bgMusic" loop src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=cyberpunk-2099-10701.mp3"></audio>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const bgMusic = document.getElementById('bgMusic');
    const soundBtn = document.getElementById('soundBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const adBtn = document.getElementById('adBtn');
    const shopModal = document.getElementById('shopModal');
    const overlayScreen = document.getElementById('overlayScreen');
    const startBtn = document.getElementById('startBtn');
    const claimBtn = document.getElementById('claimBtn');

    function getStoredInt(key, def) {
      try {
        const val = localStorage.getItem(key);
        return val !== null ? parseInt(val, 10) : def;
      } catch(e) { return def; }
    }
    function setStored(key, val) {
      try { localStorage.setItem(key, val); } catch(e) {}
    }

    let highScore = getStoredInt('space_dodge_highscore', 0);
    let coins = getStoredInt('space_dodge_coins', 0);

    let gameStarted = false;
    let gameOver = false;
    let isPaused = false;
    let musicPlaying = false;

    let player = { x: 180, y: 420, width: 36, height: 40, speed: 6, shipIndex: 0 };
    let bullets = [];
    let enemyBullets = [];
    let obstacles = [];
    let coinItems = [];
    let powerups = [];
    let particles = [];
    let stars = [];
    let boss = null;

    let score = 0;
    let combo = 0;
    let comboTimer = 0;
    let moveLeft = false;
    let moveRight = false;
    let isFiring = false;
    let fireCooldown = 0;

    let hasShield = false;
    let magnetActive = false;
    let hyperBoost = false;
    let hyperTimer = 0;

    // Starfield Background Setup
    for (let i = 0; i < 60; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2 + 0.5,
        speed: Math.random() * 2 + 1
      });
    }

    // Mission System
    let currentMission = null;
    let missionProgress = 0;
    let missionReady = false;

    const missionsList = [
      { text: "Collect 5 Coins", goal: 5, reward: 10, type: "coins" },
      { text: "Survive 30 Seconds", goal: 30, reward: 15, type: "time" },
      { text: "Reach Score 500", goal: 500, reward: 20, type: "score" }
    ];

    function initMission() {
      currentMission = missionsList[Math.floor(Math.random() * missionsList.length)];
      missionProgress = 0;
      missionReady = false;
      claimBtn.style.display = 'none';
      document.getElementById('missionText').textContent = `${currentMission.text} (0/${currentMission.goal})`;
    }
    initMission();

    claimBtn.addEventListener('click', () => {
      if (missionReady) {
        coins += currentMission.reward;
        setStored('space_dodge_coins', coins);
        updateShopUI();
        initMission();
      }
    });

    const shipCatalog = [
      { name: "Cyan Dart", price: 0, color: "#00f0ff", type: 0 },
      { name: "Crimson Viper", price: 10, color: "#ff0055", type: 1 },
      { name: "Gold Rocket", price: 20, color: "#ffd700", type: 2 },
      { name: "Cyber Violet", price: 30, color: "#a855f7", type: 0 },
      { name: "Emerald Flare", price: 40, color: "#10b981", type: 1 },
      { name: "Solar Flare", price: 50, color: "#f97316", type: 2 },
      { name: "Void Spectre", price: 60, color: "#6366f1", type: 0 },
      { name: "Plasma Cruiser", price: 75, color: "#ec4899", type: 1 },
      { name: "Apex Blade", price: 90, color: "#06b6d4", type: 2 },
      { name: "Neon Phantom", price: 100, color: "#f43f5e", type: 0 },
      { name: "Shadow Reaper", price: 120, color: "#8b5cf6", type: 1 },
      { name: "Thunderbird", price: 150, color: "#eab308", type: 2 },
      { name: "Hyperion", price: 180, color: "#3b82f6", type: 0 },
      { name: "Valkyrie", price: 200, color: "#d946ef", type: 1 },
      { name: "Titan Interceptor", price: 250, color: "#f43f5e", type: 2 },
      { name: "Quantum Saucer", price: 300, color: "#14b8a6", type: 0 },
      { name: "Starlight Destroyer", price: 400, color: "#facc15", type: 1 },
      { name: "Supernova", price: 500, color: "#fb923c", type: 2 },
      { name: "Galaxy Sovereign", price: 750, color: "#c084fc", type: 0 },
      { name: "Omega Dreadnought", price: 1000, color: "#e11d48", type: 1 }
    ];

    let ownedSkins = [0];

    function renderShop() {
      const grid = document.getElementById('shopGrid');
      grid.innerHTML = '';
      shipCatalog.forEach((ship, idx) => {
        const card = document.createElement('div');
        card.className = 'shop-card';
        const isOwned = ownedSkins.includes(idx);
        const isEquipped = player.shipIndex === idx;

        card.innerHTML = `
          <strong style="font-size:12px; color:${ship.color}">${ship.name}</strong>
          <button class="buy-btn" id="shipBtn_${idx}">${isEquipped ? 'Equipped' : (isOwned ? 'Equip' : ship.price + ' 🪙')}</button>
        `;
        grid.appendChild(card);

        document.getElementById(`shipBtn_${idx}`).addEventListener('click', () => {
          if (ownedSkins.includes(idx)) {
            player.shipIndex = idx;
            renderShop();
          } else if (coins >= ship.price) {
            coins -= ship.price;
            ownedSkins.push(idx);
            player.shipIndex = idx;
            setStored('space_dodge_coins', coins);
            updateShopUI();
            renderShop();
          } else {
            alert("Not enough coins!");
          }
        });
      });
    }

    function toggleShop() {
      shopModal.style.display = shopModal.style.display === 'block' ? 'none' : 'block';
      updateShopUI();
      if (shopModal.style.display === 'block') renderShop();
    }
    document.getElementById('shopBtn').addEventListener('click', toggleShop);

    function updateShopUI() {
      document.getElementById('shopCoins').textContent = coins;
    }

    // Audio & Button Handlers
    soundBtn.addEventListener('click', () => {
      if (!musicPlaying) {
        bgMusic.play().catch(() => {});
        soundBtn.textContent = '🎧 Audio: ON';
        musicPlaying = true;
      } else {
        bgMusic.pause();
        soundBtn.textContent = '🎧 Audio: OFF';
        musicPlaying = false;
      }
    });

    pauseBtn.addEventListener('click', () => {
      if (!gameStarted || gameOver) return;
      isPaused = !isPaused;
      pauseBtn.textContent = isPaused ? '▶ Resume' : '⏸️ Pause';
    });

    adBtn.addEventListener('click', () => {
      alert("📺 Free reward unlocked! (+5 Coins)");
      coins += 5;
      setStored('space_dodge_coins', coins);
      updateShopUI();
    });

    startBtn.addEventListener('click', () => {
      overlayScreen.style.display = 'none';
      gameStarted = true;
      restartGame();
    });

    function restartGame() {
      player.x = 180;
      bullets = [];
      enemyBullets = [];
      obstacles = [];
      coinItems = [];
      powerups = [];
      particles = [];
      boss = null;
      score = 0;
      combo = 0;
      hasShield = false;
      magnetActive = false;
      hyperBoost = false;
      gameOver = false;
      isPaused = false;
      pauseBtn.textContent = '⏸️ Pause';
      if (musicPlaying) bgMusic.play().catch(() => {});
    }

    // Keyboard & Touch Setup
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft = true;
      if (e.key === 'ArrowRight' || e.key === 'd') moveRight = true;
      if (e.key === ' ' || e.key === 'w') isFiring = true;
      if (gameOver && e.key === ' ') restartGame();
    });
    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft = false;
      if (e.key === 'ArrowRight' || e.key === 'd') moveRight = false;
      if (e.key === ' ' || e.key === 'w') isFiring = false;
    });

    const fireBtn = document.getElementById('fireBtn');
    const leftBtn = document.getElementById('leftBtn');
    const rightBtn = document.getElementById('rightBtn');

    const bindTouch = (elem, startFn, stopFn) => {
      elem.addEventListener('touchstart', (e) => { e.preventDefault(); startFn(); });
      elem.addEventListener('touchend', (e) => { e.preventDefault(); stopFn(); });
      elem.addEventListener('mousedown', startFn);
      elem.addEventListener('mouseup', stopFn);
    };

    bindTouch(leftBtn, () => moveLeft = true, () => moveLeft = false);
    bindTouch(rightBtn, () => moveRight = true, () => moveRight = false);
    bindTouch(fireBtn, () => isFiring = true, () => isFiring = false);

    canvas.addEventListener('click', () => {
      if (gameOver) restartGame();
    });

    function createExplosion(x, y, color, count = 12) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          life: 25,
          color
        });
      }
    }

    function spawnElements() {
      let diff = Math.min(score / 3000, 1.5);
      
      // Boss Spawn Condition
      if (!boss && Math.floor(score / 10) > 0 && Math.floor(score / 10) % 500 === 0) {
        boss = {
          x: canvas.width / 2 - 40,
          y: -80,
          width: 80,
          height: 50,
          hp: 30,
          maxHp: 30,
          direction: 1
        };
      }

      if (!boss && Math.random() < 0.035 + diff * 0.02) {
        let size = Math.random() * 25 + 20;
        obstacles.push({
          x: Math.random() * (canvas.width - size),
          y: -size,
          width: size,
          height: size,
          speed: Math.random() * 3 + 2.5 + diff * 2
        });
      }
      if (Math.random() < 0.018) {
        coinItems.push({ x: Math.random() * (canvas.width - 20), y: -20, size: 16, speed: 2.5 });
      }
      if (Math.random() < 0.004) {
        const types = ['shield', 'magnet', 'hyper'];
        powerups.push({
          x: Math.random() * (canvas.width - 24),
          y: -24,
          size: 20,
          type: types[Math.floor(Math.random() * types.length)],
          speed: 2
        });
      }
    }

    function updateMission(type, amount) {
      if (missionReady || !currentMission) return;
      if (currentMission.type === type) {
        missionProgress += amount;
        if (missionProgress >= currentMission.goal) {
          missionProgress = currentMission.goal;
          missionReady = true;
          claimBtn.style.display = 'inline-block';
        }
        document.getElementById('missionText').textContent = `${currentMission.text} (${Math.floor(missionProgress)}/${currentMission.goal})`;
      }
    }

    function update() {
      if (!gameStarted || gameOver || isPaused) return;

      // Background Star Motion
      stars.forEach(star => {
        star.y += hyperBoost ? star.speed * 4 : star.speed;
        if (star.y > canvas.height) star.y = 0;
      });

      // Player Movement
      if (moveLeft && player.x > 0) player.x -= player.speed;
      if (moveRight && player.x < canvas.width - player.width) player.x += player.speed;

      // Shooting Logic
      fireCooldown--;
      if (isFiring && fireCooldown <= 0) {
        bullets.push({ x: player.x + 18, y: player.y, speed: 10 });
        if (hyperBoost) {
          bullets.push({ x: player.x + 6, y: player.y, speed: 10 });
          bullets.push({ x: player.x + 30, y: player.y, speed: 10 });
        }
        fireCooldown = hyperBoost ? 6 : 12;
      }

      // Update Bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y -= bullets[i].speed;
        if (bullets[i].y < 0) bullets.splice(i, 1);
      }

      // Update Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].x += particles[i].vx;
        particles[i].y += particles[i].vy;
        particles[i].life--;
        if (particles[i].life <= 0) particles.splice(i, 1);
      }

      spawnElements();
      updateMission('time', 1 / 60);
      updateMission('score', 1 / 10);

      // Boss Logic
      if (boss) {
        if (boss.y < 40) boss.y += 1;
        boss.x += boss.direction * 2;
        if (boss.x < 10 || boss.x > canvas.width - boss.width - 10) boss.direction *= -1;

        if (Math.random() < 0.03) {
          enemyBullets.push({ x: boss.x + 20, y: boss.y + 50, speed: 4 });
          enemyBullets.push({ x: boss.x + 60, y: boss.y + 50, speed: 4 });
        }

        // Bullet hitting Boss
        for (let b = bullets.length - 1; b >= 0; b--) {
          let bul = bullets[b];
          if (bul.x > boss.x && bul.x < boss.x + boss.width && bul.y > boss.y && bul.y < boss.y + boss.height) {
            boss.hp--;
            createExplosion(bul.x, bul.y, '#ffd700', 5);
            bullets.splice(b, 1);
            if (boss.hp <= 0) {
              createExplosion(boss.x + 40, boss.y + 25, '#ff0055', 40);
              coins += 50;
              score += 1000;
              boss = null;
              break;
            }
          }
        }
      }

      // Enemy Bullets
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        let eb = enemyBullets[i];
        eb.y += eb.speed;
        if (eb.x > player.x && eb.x < player.x + player.width && eb.y > player.y && eb.y < player.y + player.height) {
          if (!hasShield && !hyperBoost) gameOver = true;
          enemyBullets.splice(i, 1);
        } else if (eb.y > canvas.height) {
          enemyBullets.splice(i, 1);
        }
      }

      // Bullets hitting Obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        for (let b = bullets.length - 1; b >= 0; b--) {
          let bul = bullets[b];
          if (bul.x > obs.x && bul.x < obs.x + obs.width && bul.y > obs.y && bul.y < obs.y + obs.height) {
            createExplosion(obs.x + obs.width / 2, obs.y + obs.height / 2, '#ff0055');
            obstacles.splice(i, 1);
            bullets.splice(b, 1);
            score += 50;
            combo++;
            comboTimer = 120;
            break;
          }
        }
      }

      // Coins Collection
      for (let i = coinItems.length - 1; i >= 0; i--) {
        let c = coinItems[i];
        if (magnetActive) {
          c.x += ((player.x + 18) - c.x) * 0.1;
          c.y += ((player.y + 20) - c.y) * 0.1;
        } else {
          c.y += c.speed;
        }

        if (player.x < c.x + c.size && player.x + player.width > c.x && player.y < c.y + c.size && player.y + player.height > c.y) {
          coins++;
          updateMission('coins', 1);
          setStored('space_dodge_coins', coins);
          coinItems.splice(i, 1);
          continue;
        }
        if (c.y > canvas.height) coinItems.splice(i, 1);
      }

      // Powerups Pickups
      for (let i = powerups.length - 1; i >= 0; i--) {
        let p = powerups[i];
        p.y += p.speed;
        if (player.x < p.x + p.size && player.x + player.width > p.x && player.y < p.y + p.size && player.y + player.height > p.y) {
          if (p.type === 'shield') hasShield = true;
          if (p.type === 'magnet') magnetActive = true;
          if (p.type === 'hyper') { hyperBoost = true; hyperTimer = 300; }
          powerups.splice(i, 1);
          continue;
        }
        if (p.y > canvas.height) powerups.splice(i, 1);
      }

      if (hyperBoost) {
        hyperTimer--;
        if (hyperTimer <= 0) hyperBoost = false;
      }

      // Obstacle Collision
      for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.y += obs.speed;

        if (player.x < obs.x + obs.width && player.x + player.width > obs.x && player.y < obs.y + obs.height && player.y + player.height > obs.y) {
          if (hyperBoost || hasShield) {
            hasShield = false;
            createExplosion(obs.x + obs.width / 2, obs.y + obs.height / 2, '#00f0ff');
            obstacles.splice(i, 1);
            continue;
          }
          gameOver = true;
          bgMusic.pause();
          if (Math.floor(score / 10) > highScore) {
            highScore = Math.floor(score / 10);
            setStored('space_dodge_highscore', highScore);
          }
        }
        if (obs.y > canvas.height) obstacles.splice(i, 1);
      }

      score++;
    }

    function drawShip(x, y, shipIdx) {
      const ship = shipCatalog[shipIdx] || shipCatalog[0];
      ctx.save();
      ctx.translate(x + 18, y + 20);

      ctx.fillStyle = ship.color;
      ctx.beginPath();
      if (ship.type === 0) {
        ctx.moveTo(0, -18); ctx.lineTo(16, 16); ctx.lineTo(0, 10); ctx.lineTo(-16, 16);
      } else if (ship.type === 1) {
        ctx.moveTo(0, -20); ctx.lineTo(18, 10); ctx.lineTo(10, 18); ctx.lineTo(0, 12); ctx.lineTo(-10, 18); ctx.lineTo(-18, 10);
      } else {
        ctx.moveTo(0, -20); ctx.lineTo(10, -5); ctx.lineTo(14, 18); ctx.lineTo(-14, 18); ctx.lineTo(-10, -5);
      }
      ctx.closePath();
      ctx.fill();

      // Thruster Flare
      ctx.fillStyle = hyperBoost ? '#ffd700' : '#ff0055';
      ctx.beginPath();
      ctx.moveTo(-6, 14); ctx.lineTo(0, 24 + Math.random() * 6); ctx.lineTo(6, 14);
      ctx.fill();

      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Starfield
      ctx.fillStyle = '#fff';
      stars.forEach(s => ctx.fillRect(s.x, s.y, s.size, s.size));

      if (gameStarted) {
        // Player Ship
        drawShip(player.x, player.y, player.shipIndex);

        if (hasShield) {
          ctx.strokeStyle = '#00f0ff';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(player.x + 18, player.y + 20, 26, 0, Math.PI * 2);
          ctx.stroke();
        }

        // Bullets
        ctx.fillStyle = '#00f0ff';
        bullets.forEach(b => ctx.fillRect(b.x - 2, b.y, 4, 10));

        // Enemy Bullets
        ctx.fillStyle = '#ff0055';
        enemyBullets.forEach(eb => ctx.fillRect(eb.x - 3, eb.y, 6, 8));

        // Particles
        particles.forEach(p => {
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, 3, 3);
        });

        // Boss
        if (boss) {
          ctx.fillStyle = '#ff0055';
          ctx.fillRect(boss.x, boss.y, boss.width, boss.height);
          // Boss Health Bar
          ctx.fillStyle = '#333';
          ctx.fillRect(boss.x, boss.y - 10, boss.width, 6);
          ctx.fillStyle = '#00f0ff';
          ctx.fillRect(boss.x, boss.y - 10, (boss.hp / boss.maxHp) * boss.width, 6);
        }

        // Obstacles
        ctx.fillStyle = '#e11d48';
        obstacles.forEach(obs => ctx.fillRect(obs.x, obs.y, obs.width, obs.height));

        // Coins
        ctx.fillStyle = '#ffd700';
        coinItems.forEach(c => {
          ctx.beginPath();
          ctx.arc(c.x + c.size / 2, c.y + c.size / 2, c.size / 2, 0, Math.PI * 2);
          ctx.fill();
        });

        // Power-ups
        powerups.forEach(p => {
          ctx.fillStyle = '#fff';
          ctx.font = '16px sans-serif';
          let icon = '🛡️️';
          if (p.type === 'magnet') icon = '🧲';
          if (p.type === 'hyper') icon = '⚡';
          ctx.fillText(icon, p.x, p.y + 16);
        });

        // HUD Text
        ctx.fillStyle = '#fff';
        ctx.font = '14px sans-serif';
        ctx.fillText('Score: ' + Math.floor(score / 10), 10, 22);
        ctx.fillText('Best: ' + highScore, 10, 40);

        ctx.fillStyle = '#ffd700';
        ctx.fillText('Coins: ' + coins + ' 🪙', canvas.width - 110, 22);

        if (gameOver) {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#ff0055';
          ctx.font = '30px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('MISSION FAILED', canvas.width / 2, canvas.height / 2 - 20);
          ctx.fillStyle = '#fff';
          ctx.font = '16px sans-serif';
          ctx.fillText('Score: ' + Math.floor(score / 10) + ' | Best: ' + highScore, canvas.width / 2, canvas.height / 2 + 10);
          ctx.fillStyle = '#00f0ff';
          ctx.fillText('Tap Screen to Restart', canvas.width / 2, canvas.height / 2 + 50);
          ctx.textAlign = 'left';
        }
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
