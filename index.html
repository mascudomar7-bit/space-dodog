    <script>
      let scene, camera, renderer;
      let player, playerBody;
      let playerShipId = 'ship1';
      let playerColor = 0x00f0ff;
      
      let coins = 0;
      let score = 0;
      let highScore = 0;
      let gameActive = false;
      let gameTime = 0;

      // Mission System State
      const MISSION_TYPES = [
        { type: 'coins', title: 'Collect Coins', targetBase: 5, reward: 10 },
        { type: 'survive', title: 'Survive Seconds', targetBase: 25, reward: 15 },
        { type: 'score', title: 'Reach Score', targetBase: 150, reward: 20 }
      ];

      let currentMission = {
        type: 'coins',
        target: 5,
        progress: 0,
        reward: 10,
        completed: false,
        claimed: false
      };

      function generateNewMission() {
        const typeObj = MISSION_TYPES[Math.floor(Math.random() * MISSION_TYPES.length)];
        let target = typeObj.targetBase;
        
        if (typeObj.type === 'coins') {
          target = Math.floor(Math.random() * 5 + 1) * 3; // e.g. 3, 6, 9, 12, 15
        } else if (typeObj.type === 'survive') {
          target = Math.floor(Math.random() * 4 + 2) * 10; // e.g. 20, 30, 40, 50
        } else if (typeObj.type === 'score') {
          target = Math.floor(Math.random() * 5 + 2) * 100; // e.g. 200, 300, 400
        }

        currentMission = {
          type: typeObj.type,
          target: target,
          progress: 0,
          reward: Math.floor(target * 0.8) + 5,
          completed: false,
          claimed: false
        };

        updateMissionUI();
      }

      function updateMissionProgress(type, amount) {
        if (currentMission.completed || currentMission.claimed) return;

        if (currentMission.type === type) {
          if (type === 'survive' || type === 'score') {
            currentMission.progress = Math.min(amount, currentMission.target);
          } else {
            currentMission.progress += amount;
          }

          if (currentMission.progress >= currentMission.target) {
            currentMission.progress = currentMission.target;
            currentMission.completed = true;
            playRewardAvailableSound();
          }
          updateMissionUI();
        }
      }

      function updateMissionUI() {
        const descEl = document.getElementById('missionDesc');
        const progEl = document.getElementById('missionProgress');
        const claimBtn = document.getElementById('claimRewardBtn');

        if (!descEl || !progEl || !claimBtn) return;

        let label = '';
        if (currentMission.type === 'coins') label = `Collect ${currentMission.target} Coins`;
        if (currentMission.type === 'survive') label = `Survive ${currentMission.target} Seconds`;
        if (currentMission.type === 'score') label = `Reach ${currentMission.target} Score`;

        descEl.textContent = label;

        if (currentMission.completed && !currentMission.claimed) {
          progEl.classList.add('hidden');
          claimBtn.classList.remove('hidden');
          claimBtn.textContent = `CLAIM (+${currentMission.reward} 🪙)`;
        } else {
          progEl.classList.remove('hidden');
          claimBtn.classList.add('hidden');
          progEl.textContent = `${Math.floor(currentMission.progress)}/${currentMission.target}`;
        }
      }

      function claimMissionReward() {
        if (!currentMission.completed || currentMission.claimed) return;

        currentMission.claimed = true;
        coins += currentMission.reward;
        updateCoinDisplay();
        playClaimRewardSound();

        // Visual flash effect on coin counters
        const coinDisplays = document.querySelectorAll('#coinCount, #menuCoins');
        coinDisplays.forEach(el => {
          el.classList.add('scale-125', 'text-yellow-300');
          setTimeout(() => el.classList.remove('scale-125', 'text-yellow-300'), 300);
        });

        // Generate next mission after claiming
        generateNewMission();
      }

      function playRewardAvailableSound() {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
          osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1); // A5
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.3);
        } catch (e) {}
      }

      function playClaimRewardSound() {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
          notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.15, ctx.currentTime + idx * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.06 + 0.2);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + idx * 0.06);
            osc.stop(ctx.currentTime + idx * 0.06 + 0.2);
          });
        } catch (e) {}
      }

      function collectCoin(coinObj) {
        coins++;
        updateCoinDisplay();
        updateMissionProgress('coins', 1);
        playCoinSound();
        createCoinParticles(coinObj.position);
      }

      function updateGame(delta) {
        if (!gameActive) return;

        gameTime += delta;
        score += delta * 10;
        
        // Track survival and score mission progress continuous updates
        updateMissionProgress('survive', Math.floor(gameTime));
        updateMissionProgress('score', Math.floor(score));

        document.getElementById('scoreDisplay').textContent = Math.floor(score);
